spring.application.name=${APPLICATION_NAME:portal}

server.port=${SERVER_PORT:8000}

logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3308}/${DATABASE_NAME:jobportal}

spring.datasource.username=${DATABASE_USERNAME:root}

spring.datasource.password=${DATABASE_PASSWORD:root}

spring.jpa.show_sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

logging.level.root=${LOGGING_LEVEL:INFO}

spring.jpa.properties.hibernate.default_batch_fetch_size=${BATCH_FETCH_SIZE:20}